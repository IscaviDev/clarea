    b.querySelector(".updno").addEventListener("click", function(){ lsSet("clarea-syncask/" + u, Date.now()); close(); });

  function openActivate(){
    var u = window.PJ6USER;
    var w = el('<div class="authwrap" role="dialog" aria-modal="true" aria-label="Activar sincronización"><div class="authcard">'
      + '<div class="authlogo">' + LOGO + '<div><h1>Sincronizar</h1><p>Cuenta «' + escT(u) + '»</p></div></div>'
      + '<p class="authtxt">Escribe tu contraseña <b>una vez</b>. Tu cuenta se guardará en la nube: entra con ella en cualquier dispositivo y el progreso se sincroniza solo.</p>'
      + '<form class="authform" novalidate><input type="text" name="user" autocomplete="username" value="' + escT(u) + '" hidden>'
      + '<label>Contraseña<input name="pass" type="password" autocomplete="current-password" maxlength="64"></label>'
      + '<p class="autherr" aria-live="polite"></p><button class="btn" type="submit">Activar sincronización</button>'
      + '<button type="button" class="authalt">Ahora no</button></form></div></div>');
    document.body.appendChild(w); addEyes(w);
    var form = w.querySelector("form"), err = w.querySelector(".autherr"), btn = form.querySelector(".btn");
    function close(){ w.classList.add("closing"); setTimeout(function(){ w.remove(); }, 220); }
    w.querySelector(".authalt").addEventListener("click", close);
    form.addEventListener("submit", function(e){
      e.preventDefault(); if (btn.disabled) return;
      var pass = form.pass.value; if (!pass){ form.pass.focus(); return; }
      btn.disabled = true; btn.textContent = "Conectando…"; err.textContent = "";
      checkLocal(u, pass).then(function(localOk){
        return cloudLogin(u, pass, localOk).then(function(j){
          return saveLocal(u, pass).then(function(){
            close(); toast(j.uploaded ? "Listo: tu cuenta ya está en la nube." : "Listo: sincronización activada.");
            syncNow();
          });
        });
      }).catch(function(e){
        err.textContent = e.net ? "Sin internet. Prueba cuando tengas conexión." : authMsg(e, "in");

      }).then(function(){ btn.disabled = false; btn.textContent = "Activar sincronización"; });
    });
    setTimeout(function(){ form.pass.focus(); }, 50);
  }

  /* ----- account bar: sync / export / import / logout ----- */
  function addBar(){
    var head = document.querySelector("[data-ubar]") || document.querySelector(".top .wrap"); if (!head || document.querySelector(".ubar")) return;
    var u = window.PJ6USER;
    var tb = el('<button type="button" class="thbtn"></button>');
    tb.addEventListener("click", function(){ window.clareaToggleTheme(); });
    head.appendChild(tb);
    var bar = el('<div class="ubar"><button type="button" class="ubtn" aria-haspopup="true" aria-expanded="false"><i>' + escT(u.charAt(0).toUpperCase()) + '</i><span>' + escT(u) + '</span></button></div>');
    head.appendChild(bar);
    applyTheme(lsGet(TH));
    var btn = bar.querySelector(".ubtn"), menu = null;
    function close(){ if (menu){ menu.remove(); menu = null; btn.setAttribute("aria-expanded", "false"); } }
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if (menu){ close(); return; }

        + (on ? '<button type="button" role="menuitem" data-a="sync">Sincronizar ahora<small><span class="sdot ' + sl.dot + '"></span>' + escT(sl.text) + '</small></button><hr>'

      bar.appendChild(menu); btn.setAttribute("aria-expanded", "true");
      menu.addEventListener("click", function(ev){
        var a = ev.target.closest("[data-a]"); if (!a) return; close();
        var act = a.dataset.a;
        if (act === "sync"){ toast("Sincronizando…"); syncNow().then(function(){ toast(syncLabel(u).text + "."); }); }
        else if (act === "act") openActivate();
        else if (act === "exp") exportProgress();
        else if (act === "imp") importProgress();
        else if (act === "upd"){ if (window.clareaCheckUpdate) window.clareaCheckUpdate(toast); else location.reload(); }
        else if (act === "sys"){ try { localStorage.removeItem(TH); } catch(e){} applyTheme(null); toast("Tema automático: sigue el del dispositivo."); }

          var done = false, out = function(){ if (done) return; done = true; cloudSet(u, null); try { localStorage.removeItem(SES); } catch(e){} location.reload(); };
          syncNow().then(out, out); setTimeout(out, 4000);
        }
      });
    });
    document.addEventListener("click", function(e){ if (menu && !bar.contains(e.target)) close(); });
  }
  document.addEventListener("DOMContentLoaded", function(){
    if (window.PJ6USER){ addBar(); lastAuto = Date.now(); setTimeout(firstSyncDone, 8000); syncNow().then(function(){ firstSyncDone(); setTimeout(maybeInvite, 1200); }); }
    else showLogin();
  });
})();

  function banner(worker) {
    if (shown || !worker) return; shown = true;
    var b = document.createElement("div");
    b.className = "updbar"; b.setAttribute("role", "status");
    b.innerHTML = '<div><b>Hay una versión nueva de Clarea</b><span>Toca «Actualizar» para usarla ahora.</span></div><button type="button" class="updgo">Actualizar</button><button type="button" class="updno" aria-label="Ahora no">✕</button>';
    document.body.appendChild(b);
    b.querySelector(".updgo").addEventListener("click", function () {
      b.querySelector(".updgo").textContent = "Actualizando…";
      worker.postMessage({type: "SKIP_WAITING"});
      setTimeout(function () { if (!reloading) location.reload(); }, 3000);
    });
    b.querySelector(".updno").addEventListener("click", function () { b.classList.add("closing"); setTimeout(function () { b.remove(); shown = false; }, 220); });
  }
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (reloading) return; reloading = true; location.reload(); });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      function watch(w) { if (!w) return; w.addEventListener("statechange", function () { if (w.state === "installed" && navigator.serviceWorker.controller) banner(w); }); }
      if (reg.waiting && navigator.serviceWorker.controller) banner(reg.waiting);
      watch(reg.installing);
      reg.addEventListener("updatefound", function () { watch(reg.installing); });
      // look for a new version now and every time the app comes back to the screen
      reg.update().catch(function () {});
      // manual check from the account menu
      window.clareaCheckUpdate = function (say) {
        if (reg.waiting) { banner(reg.waiting); return; }
        say("Buscando actualizaciones…");
        reg.update().then(function () {
          setTimeout(function () {
            if (reg.waiting) banner(reg.waiting);
            else if (reg.installing) say("Descargando la versión nueva…");
            else say("Ya tienes la última versión.");
          }, 1500);
        }).catch(function () { say("Sin conexión: no se puede comprobar ahora."); });
      };
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
    }).catch(function () {});
  });
})();
</script>
</body>
