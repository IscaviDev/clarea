<style>
/* Clarea home: brand blue/orange from the Clarea identity; each subject keeps its own colour from the school timetable */
:root{
  --clarea-blue:#1f5fbf; --clarea-orange:#b4561b;
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#eef1f5; --fg:#18202b; --muted:#5b6574; --line:#dfe3ea;
  --accent:#1f5fbf; --accent-ink:#1f5fbf; --accent-soft:#e6eefb;
  --ok:#1f7a3f; --ok-soft:#e3f3e8; --warn:#8a5a00; --warn-soft:#fdf1d8; --lim:#b4561b; --lim-soft:#fbe9dc; --err:#b3261e; --err-soft:#fbe7e5;
  --f:"Inter", -apple-system, "Segoe UI", Roboto, sans-serif; --mono:ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --clarea-blue:#76a7f2; --clarea-orange:#e3925a;
  --bg:#12161c; --surface:#181d25; --sunk:#20262f; --fg:#e3e7ec; --muted:#9aa4b1; --line:#2a313b;
  --accent:#76a7f2; --accent-ink:#9cc0f6; --accent-soft:#1d2a3d;
  --ok:#5fcf86; --ok-soft:#173222; --warn:#f0c060; --warn-soft:#352a12; --lim:#f0995a; --lim-soft:#3a2516; --err:#ff8a80; --err-soft:#3b1b19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --clarea-blue:#76a7f2; --clarea-orange:#e3925a;
  --bg:#12161c; --surface:#181d25; --sunk:#20262f; --fg:#e3e7ec; --muted:#9aa4b1; --line:#2a313b;
  --accent:#76a7f2; --accent-ink:#9cc0f6; --accent-soft:#1d2a3d;
  --ok:#5fcf86; --ok-soft:#173222; --warn:#f0c060; --warn-soft:#352a12; --lim:#f0995a; --lim-soft:#3a2516; --err:#ff8a80; --err-soft:#3b1b19;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;background:#1f5fbf;color:#fff;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.cbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.cbar .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.clogo{display:flex;align-items:center;text-decoration:none}
.clogo svg{height:28px;width:auto;display:block}
.clogo .lg-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .clogo .lg-light{display:none}:root:not([data-theme="light"]) .clogo .lg-dark{display:block}}
:root[data-theme="dark"] .clogo .lg-light{display:none}:root[data-theme="dark"] .clogo .lg-dark{display:block}

main .wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2{margin:0;line-height:1.15;text-wrap:balance}
.hello h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hello p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.sect{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px}
.back{align-self:flex-start;background:none;border:0;color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px}

/* today strip */
.today{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 0 10px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.today h2{font-size:15px;font-weight:700;padding:0 14px;display:flex;justify-content:space-between;align-items:baseline}
.today h2 small{font-size:12px;font-weight:600;color:var(--muted)}
.tdlist{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scroll-snap-type:x proximity;scroll-padding:0 14px;padding:0 14px 8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;cursor:grab}
.tdlist.drag{cursor:grabbing;scroll-snap-type:none}
.tdlist::-webkit-scrollbar{height:5px}
.tdlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tdi{flex:none;border-radius:10px;padding:7px 10px;background:var(--sbg);color:var(--sfg);display:flex;flex-direction:column;gap:1px;min-width:78px;border:0;text-align:left;cursor:pointer;scroll-snap-align:start}
.tdi b{font-size:14px}.tdi small{font-size:11.5px;font-weight:600;opacity:.8}
.tdi.now{box-shadow:0 0 0 3px var(--clarea-orange)}
.tdempty{color:var(--muted);font-size:14px;margin:0;padding:0 14px}

/* subject cards (like the lab cards) */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.sgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.scard{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;border-radius:var(--r);padding:14px 14px 13px;background:var(--sbg);color:var(--sfg);cursor:pointer;min-height:108px;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.scard:active{transform:scale(.98)}
.scard b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.scard span{font-size:13.5px;font-weight:500;line-height:1.3;opacity:.92}
.scard em{margin-top:auto;font-style:normal;font-size:11.5px;font-weight:700;align-self:flex-start;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.55);color:#18202b}

/* subject page */
.sban{border-radius:var(--r);padding:18px 16px;background:var(--sbg);color:var(--sfg);display:flex;flex-direction:column;gap:4px}
.sban b{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.sban span{font-size:15px;font-weight:500}
.lcard{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;color:var(--fg);text-decoration:none;min-width:0}
.lcard:hover{border-color:var(--accent)}
.lcard .lico{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--sunk)}
.lcard .lico svg{width:30px;height:30px}
.lcard .ltx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lcard .ltx b{font-size:17px;font-weight:800}
.lcard .ltx span{font-size:13.5px;color:var(--muted)}
.lcard .lgo{flex:none;color:var(--muted);font-size:20px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted);font-size:14.5px}

/* timetable: fits a phone screen without scrolling */
.thead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.thead h1{font-size:22px;font-weight:800}
.thead span{font-size:13px;color:var(--muted)}
.tt{display:grid;grid-template-columns:38px repeat(5,minmax(0,1fr));grid-template-rows:auto repeat(3,minmax(54px,1fr)) 16px repeat(3,minmax(54px,1fr));gap:4px;height:min(560px,calc(100dvh - 205px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));min-height:440px}
.tt .dh{font-size:12px;font-weight:700;text-align:center;color:var(--muted);padding-bottom:2px}
.tt .dh.td{color:var(--clarea-orange)}
.tt .tm{font-size:10.5px;font-weight:600;color:var(--muted);text-align:right;padding-right:4px;line-height:1.15;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;justify-content:flex-start;padding-top:3px}
.tt .tm small{font-weight:500;opacity:.8}
.tt .brk{grid-column:1/-1;display:flex;align-items:center;font-size:10px;font-weight:700;color:var(--muted);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.tt .brk span{width:38px;text-align:right;padding-right:4px}
.tt .cl{border:0;border-radius:8px;background:var(--sbg);color:var(--sfg);padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;cursor:pointer;min-width:0;overflow:hidden;position:relative}
.tt .cl b{font-size:13px;font-weight:800;line-height:1.1}
.tt .cl span{font-size:10.5px;font-weight:600;line-height:1.15;opacity:.9;overflow-wrap:break-word}
.tt .cl small{font-size:9.5px;font-weight:600;opacity:.75;line-height:1.1;margin-top:1px}
@media (min-width:600px){.tt .cl small{font-size:11px}}
.tt .cl.now{box-shadow:0 0 0 3px var(--clarea-orange)}
.tt .cl.now::after{content:"ahora";position:absolute;top:2px;right:3px;font-size:8.5px;font-weight:800;background:var(--clarea-orange);color:#fff;border-radius:4px;padding:0 3px}
.tt .fr{border-radius:8px;background:var(--sunk);opacity:.55}
.tt .tdcol{box-shadow:inset 0 0 0 2px var(--clarea-orange)}
@media (min-width:600px){.tt .cl b{font-size:15px}.tt .cl span{font-size:12px}}

/* bottom sheet */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet .shh{display:flex;align-items:center;gap:12px}
.sheet .shh i{flex:none;width:52px;height:52px;border-radius:12px;background:var(--sbg);color:var(--sfg);font-style:normal;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.sheet .shh div{display:flex;flex-direction:column;min-width:0}
.sheet .shh b{font-size:17px}
.sheet .shh span{font-size:13.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.kv small{font-size:11.5px;color:var(--muted)}
.kv b{font-size:15px;font-variant-numeric:tabular-nums}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-weight:700;font-size:14.5px;cursor:pointer}

/* absences */
.fsum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.fsum .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fsum .big b{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.fsum .big span{color:var(--muted);font-size:14px}
.fbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:4px;background:var(--st)}
.stchips{display:flex;flex-wrap:wrap;gap:6px}
.stchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--sts);color:var(--st)}
.st-ok{--st:var(--ok);--sts:var(--ok-soft)}.st-aviso{--st:var(--warn);--sts:var(--warn-soft)}.st-limite{--st:var(--lim);--sts:var(--lim-soft)}.st-susp{--st:var(--err);--sts:var(--err-soft)}
.fnote{margin:0;font-size:13px;color:var(--muted)}
.flist{display:flex;flex-direction:column;gap:8px}
details.fr2{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sbg);border-radius:12px;min-width:0}
details.fr2>summary{list-style:none;cursor:pointer;padding:11px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
details.fr2>summary::-webkit-details-marker{display:none}
.fcode{grid-row:span 2;align-self:start;min-width:48px;text-align:center;border-radius:8px;padding:6px 6px;font-weight:800;font-size:13.5px;background:var(--sbg);color:var(--sfg)}
.fname{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhrs{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.fhrs small{font-weight:500;color:var(--muted)}
.fmeter{grid-column:2/4;display:flex;align-items:center;gap:8px}
.fmeter .fbar{flex:1}
.fmeter .stchip{padding:1px 8px;font-size:11px}
.fbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:stretch}
.step button{border:1px solid var(--line);background:var(--bg);border-radius:12px;font-size:22px;font-weight:700;cursor:pointer;min-height:52px}
.step label{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sunk);border-radius:12px;padding:4px}
.step label small{font-size:11.5px;color:var(--muted)}
.step input{width:100%;max-width:120px;border:0;background:none;text-align:center;font:inherit;font-size:22px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;padding:0}
.step input:focus{outline:none}
.ftot{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ftot input{width:72px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font:inherit;font-size:16px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- screen transitions + small motion ---------- */
.pg{display:flex;flex-direction:column;align-items:stretch;gap:16px;min-width:0;width:100%}
/* Safari: give every block the full width explicitly instead of relying on flex stretch */
.pg>*{width:100%;max-width:100%;box-sizing:border-box}
.pg>.back{width:auto;align-self:flex-start}
@keyframes pg-in{from{opacity:0;transform:translateX(var(--dx,22px))}to{opacity:1;transform:none}}
@keyframes it-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sh-bg{from{opacity:0}to{opacity:1}}
@keyframes sh-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: no-preference){
  .pg.enter{animation:pg-in .3s cubic-bezier(.2,.8,.2,1) both}
  .pg.enter.back{--dx:-22px}
  .pg.enter .scard,.pg.enter .tdi,.pg.enter .lcard,.pg.enter .tt .cl,.pg.enter .tt .fr,.pg.enter .fr2{animation:it-in .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 28ms + 60ms)}
  .sheetbg{animation:sh-bg .22s ease both}
  .sheetbg .sheet{animation:sh-up .3s cubic-bezier(.2,.8,.2,1) both}
  .sheetbg.closing{animation:sh-bg .22s ease reverse both}
  .sheetbg.closing .sheet{animation:sh-up .22s ease-in reverse both}
  .fbar i{transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .step input.bump{animation:bump .3s ease}
  .stchip{transition:background-color .3s ease,color .3s ease}
}
.noanim>:not(summary){animation:none!important}
</style>
<style>
/* ---------- login + account bar (offline app only) ---------- */
html,body{margin:0}
.authwrap{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.authcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;margin-top:4vh}
.authlogo{display:flex;align-items:center;gap:12px}
.authlogo svg{width:44px;height:44px;flex:none}
.authlogo h1{font-size:20px;font-weight:800}
.authlogo p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.authtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:10px;padding:4px}
.authtabs button{border:0;background:none;border-radius:7px;padding:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--fg)}
.authtabs button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.authform{display:flex;flex-direction:column;gap:10px}
.authform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.authform input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px}
.authform input:focus{border-color:var(--accent);outline:none}
.autherr{margin:0;font-size:13.5px;color:var(--err);min-height:1em}
.authknown{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.authknown button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--fg)}
.authnote{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.thbtn{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.thbtn svg{width:19px;height:19px}
.ubar{margin-left:8px;position:relative}
.ubtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px 5px 6px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--fg);max-width:44vw}
.ubtn i{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ubtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.umenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:220px}
.umenu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;font-size:14.5px;cursor:pointer;color:var(--fg)}
.umenu button:hover{background:var(--sunk)}
.umenu small{display:block;font-size:12px;color:var(--muted)}
.umenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.uver{margin:4px 12px 4px;font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}

/* ---------- "new version" banner ---------- */
.updbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:110;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-left:5px solid #1f5fbf;border-radius:14px;padding:12px 10px 12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.updbar>div{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.updbar b{font-size:14.5px}
.updbar span{font-size:12.5px;color:var(--muted)}
.updgo{flex:none;border:0;background:#1f5fbf;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}
.updno{flex:none;border:0;background:none;color:var(--muted);font-size:16px;width:32px;height:32px;border-radius:8px;cursor:pointer}
@keyframes upd-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ----- absences (same maths as the Excel) ----- */
function faltas(){
  const st = lget("clarea-faltas") || {t:0, rows:{}};
  const out = {};
  FALTAS_ORDER.forEach(c=>{ const s = FALTAS_SEED[c], r = st.rows[c] || {}; out[c] = {tot: r.tot ?? s[0], f: r.f ?? s[1]}; });
  return out;
}
function saveFalta(c, patch){
  const st = lget("clarea-faltas") || {t:0, rows:{}};
  st.rows[c] = Object.assign({}, faltas()[c], st.rows[c] || {}, patch); st.t = Date.now();
  lset("clarea-faltas", st);
}
function calc(r){
  const max = r.tot * 0.2, rest = max - r.f, pct = r.tot ? r.f / r.tot : 0;
  const st = r.f > max + 1e-9 ? "susp" : Math.abs(r.f - max) < 1e-9 ? "limite" : r.f >= max * 0.75 ? "aviso" : "ok";
  return {max, rest, pct, st, use: max ? Math.min(1, r.f / max) : 0};
}

}

function viewTimetable(){
  const N = nowInfo();
  let h = '<button class="back" data-go="#/asig/TUT">← Tutoría</button><div class="thead"><h1>Horario</h1><span>DAW-2A · aula '+ROOM+' · toca una clase</span></div><div class="tt">';
  h += '<div></div>'+DSH.map((d,i)=>'<div class="dh'+(i===N.wd?' td':'')+'">'+d+'</div>').join("");
  const rowOf = slot => slot < 3 ? slot + 2 : slot + 3;   // grid rows: 1 header, 2-4 slots, 5 break, 6-8 slots
  SLOTS.forEach((s,i)=>{ h += '<div class="tm" style="grid-row:'+rowOf(i)+';grid-column:1">'+s[0]+'<small>'+s[1]+'</small></div>'; });
  h += '<div class="brk" style="grid-row:5"><span>Patio</span></div>';
  const used = {};
  CLASSES.forEach((c,ci)=>{
    const r0 = rowOf(c[1]), r1 = rowOf(c[1]+c[2]-1) + 1;
    for (let k=0;k<c[2];k++) used[c[0]+"-"+(c[1]+k)] = 1;
    h += '<button class="cl'+(N.isNow(c[0],c[1],c[2])?' now':'')+'" style="grid-column:'+(c[0]+2)+';grid-row:'+r0+' / '+r1+';'+sv(c[3])+'" data-cls="'+ci+'"><b>'+(c[3]==="TUT"?"TUT":c[3])+'</b><span>'+esc(c[4])+'</span><small>'+esc(c[5])+'</small></button>';
  });
  for (let d=0; d<5; d++) for (let sl=0; sl<6; sl++) if (!used[d+"-"+sl]) h += '<div class="fr" style="grid-column:'+(d+2)+';grid-row:'+rowOf(sl)+'"></div>';
  return h + '</div>';
}
function faltaRow(c, r){
  const k = calc(r), s = SUBJ[c];
  return '<details class="fr2" data-f="'+c+'" style="'+sv(c)+'"><summary><span class="fcode">'+c+'</span><span class="fname">'+esc(s.n)+'</span><span class="fhrs">'+num(r.f)+' h <small>/ '+num(k.max)+'</small></span><span class="fmeter st-'+k.st+'"><span class="fbar"><i style="width:'+Math.round(k.use*100)+'%"></i></span>'+stChip(k.st)+'</span></summary>'
   + '<div class="fbody"><div class="step"><button type="button" data-fadd="-0.5" aria-label="Quitar media hora">−</button><label><small>Horas faltadas</small><input type="text" inputmode="decimal" value="'+num(r.f)+'" data-fin aria-label="Horas faltadas de '+c+'"></label><button type="button" data-fadd="0.5" aria-label="Añadir media hora">+</button></div>'
   + '<div class="kv"><div><small>Máximo (20 %)</small><b>'+num(k.max)+' h</b></div><div><small>Te quedan</small><b>'+num(Math.max(0,k.rest))+' h</b></div><div><small>% faltas</small><b>'+num(k.pct*100)+' %</b></div></div>'
   + '<label class="ftot">Horas totales de la asignatura <input type="text" inputmode="decimal" value="'+num(r.tot)+'" data-ftot></label></div></details>';
}
function fsumHtml(F){
  let tf = 0, tmax = 0, ttot = 0; const cnt = {ok:0, aviso:0, limite:0, susp:0};
  FALTAS_ORDER.forEach(c=>{ const k = calc(F[c]); tf += F[c].f; tmax += k.max; ttot += F[c].tot; cnt[k.st]++; });
  const risk = FALTAS_ORDER.map(c=>[c, calc(F[c])]).filter(x=>x[1].use>0).sort((a,b)=>b[1].use-a[1].use).slice(0,3);
  return '<div class="fsum st-'+(cnt.susp?'susp':cnt.limite?'limite':cnt.aviso?'aviso':'ok')+'"><div class="big"><b>'+num(tf)+' h</b><span>faltadas de '+num(tmax)+' h permitidas · '+num(ttot? tf/ttot*100 : 0)+' % del total</span></div><div class="fbar"><i style="width:'+Math.round(Math.min(1, tmax? tf/tmax : 0)*100)+'%"></i></div>'
   + '<div class="stchips">'+["ok","aviso","limite","susp"].filter(s=>cnt[s]).map(s=>'<span class="stchip st-'+s+'">'+STL[s]+': '+cnt[s]+' asignatura'+(cnt[s]>1?'s':'')+'</span>').join("")+'</div>'
   + (risk.length ? '<p class="fnote">Más cerca del límite: '+risk.map(x=>'<b>'+x[0]+'</b> '+Math.round(x[1].use*100)+' %').join(" · ")+'</p>' : '')+'</div>';
}
function viewFaltas(){
  const F = faltas();
  let h = '<button class="back" data-go="#/asig/TUT">← Tutoría</button><div class="thead"><h1>Faltas de asistencia</h1><span>Límite: 20 % de las horas de cada asignatura</span></div>';
  h += fsumHtml(F);
  h += '<p class="fnote">Toca una asignatura para apuntar o quitar horas. Se guarda solo, en tu cuenta.</p>';
  h += '<div class="flist">'+FALTAS_ORDER.map(c=>faltaRow(c, F[c])).join("")+'</div>';
  return h;
}

/* ===================== router ===================== */
let lastRoute = null;
const depth = r => r.startsWith("asig/") ? 1 : (r === "horario" || r === "faltas") ? 2 : 0;
function render(){
  if (!window.PJ6USER){ $("#app").innerHTML = ""; return; }
  const r = location.hash.replace(/^#\/?/, "");
  let h;
  if (r.startsWith("asig/")) h = viewSubject(r.slice(5));
  else if (r === "horario") h = viewTimetable();
  else if (r === "faltas") h = viewFaltas();
  else h = viewHome();
  // a new screen slides in (from the right going forward, from the left going back); edits on the same screen don't move
  const isNew = r !== lastRoute, back = lastRoute !== null && depth(r) < depth(lastRoute);
  $("#app").innerHTML = '<div class="pg'+(isNew ? ' enter'+(back ? ' back' : '') : '')+'">'+h+'</div>';
  lastRoute = r;
  if (isNew) [".scard", ".tdi", ".lcard", ".tt .cl", ".tt .fr", ".fr2"].forEach(sel=>document.querySelectorAll("#app "+sel).forEach((el,i)=>el.style.setProperty("--i", Math.min(i, 16))));
}
window.clareaRefresh = render;
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

/* class detail sheet (from the timetable or "Hoy") */
function openClass(ci){
  const c = CLASSES[ci], code = c[3], s = SUBJ[code], F = faltas()[code];
  const k = F ? calc(F) : null;
  const bg = document.createElement("div"); bg.className = "sheetbg";
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+code+'"><span class="grab"></span><div class="shh" style="'+sv(code)+'"><i>'+(code==="TUT"?"TUT":code)+'</i><div><b>'+esc(s.n)+'</b><span>'+DAYS[c[0]]+' · '+SLOTS[c[1]][0]+' – '+SLOTS[c[1]+c[2]-1][1]+' · '+esc(c[5])+' · aula '+ROOM+'</span></div></div>'
   + (k ? '<div class="kv"><div><small>Faltas</small><b>'+num(F.f)+' h</b></div><div><small>Máximo</small><b>'+num(k.max)+' h</b></div><div><small>Estado</small><b>'+STL[k.st]+'</b></div></div>'
        + '<div class="row2"><button class="btn" data-sadd="'+code+'" data-h="'+c[2]+'">+ Apuntar falta ('+c[2]+' h)</button><button class="btn2" data-close>Cerrar</button></div>'
        : '<button class="btn2" data-close>Cerrar</button>')
   + '</div>';
  const close = ()=>{ bg.classList.add("closing"); setTimeout(()=>bg.remove(), 230); };
  bg.addEventListener("click", e=>{
    if (e.target === bg || e.target.closest("[data-close]")) { close(); return; }
    const a = e.target.closest("[data-sadd]");
    if (a){ const cur = faltas()[a.dataset.sadd]; saveFalta(a.dataset.sadd, {f: Math.round((cur.f + +a.dataset.h)*2)/2}); close(); render(); toast("Apuntada "+a.dataset.h+" h de falta en "+a.dataset.sadd+"."); }
  });
  document.body.appendChild(bg);
}

/* clicks + edits */
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if (g){ location.hash = g.dataset.go; return; }
  const cl = e.target.closest("[data-cls]"); if (cl){ openClass(+cl.dataset.cls); return; }
  const ad = e.target.closest("[data-fadd]");
  if (ad){ const row = ad.closest("[data-f]"), c = row.dataset.f, cur = faltas()[c];
    const v = Math.max(0, Math.round((cur.f + +ad.dataset.fadd)*2)/2); saveFalta(c, {f:v}); refreshRow(c); }
});
/* "Hoy" strip: mouse wheel and mouse drag also scroll it sideways (touch already does) */
document.addEventListener("wheel", e=>{
  const l = e.target.closest(".tdlist"); if (!l || l.scrollWidth <= l.clientWidth) return;
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ l.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive:false});
let drag = null;
document.addEventListener("pointerdown", e=>{
  if (e.pointerType !== "mouse") return;
  const l = e.target.closest(".tdlist"); if (!l) return;
  drag = {l, x: e.clientX, left: l.scrollLeft, moved: false};
});
document.addEventListener("pointermove", e=>{
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 4){ drag.moved = true; drag.l.classList.add("drag"); }
  if (drag.moved) drag.l.scrollLeft = drag.left - dx;
});
document.addEventListener("pointerup", ()=>{
  if (!drag) return;
  const d = drag; drag = null; d.l.classList.remove("drag");
  if (d.moved){ const stop = ev=>{ ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener("click", stop, {capture:true, once:true}); setTimeout(()=>document.removeEventListener("click", stop, true), 50); }
});
function parseNum(v){ const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) && x >= 0 ? Math.round(x*100)/100 : null; }
document.addEventListener("change", e=>{
  const row = e.target.closest("[data-f]"); if (!row) return; const c = row.dataset.f;
  if (e.target.matches("[data-fin]")){ const v = parseNum(e.target.value); if (v === null){ toast("Escribe un número, por ejemplo 1,5."); refreshRow(c); return; } saveFalta(c, {f:v}); refreshRow(c); }
  if (e.target.matches("[data-ftot]")){ const v = parseNum(e.target.value); if (!v){ toast("Las horas totales deben ser mayores que 0."); refreshRow(c); return; } saveFalta(c, {tot:v}); refreshRow(c); }
});
function refreshRow(c){
  // update only this subject and the summary in place: nothing else closes or moves, the bars glide
  const row = document.querySelector('[data-f="'+c+'"]'); if (!row){ render(); return; }
  const r = faltas()[c], k = calc(r);
  row.querySelector(".fhrs").innerHTML = num(r.f)+' h <small>/ '+num(k.max)+'</small>';
  const meter = row.querySelector(".fmeter"); meter.className = "fmeter st-"+k.st;
  meter.querySelector(".fbar i").style.width = Math.round(k.use*100)+"%";
  const chip = meter.querySelector(".stchip"); chip.className = "stchip st-"+k.st; chip.textContent = STL[k.st];
  const inp = row.querySelector("[data-fin]"); if (document.activeElement !== inp) inp.value = num(r.f);
  const tot = row.querySelector("[data-ftot]"); if (document.activeElement !== tot) tot.value = num(r.tot);
  const kv = row.querySelectorAll(".kv b"); kv[0].textContent = num(k.max)+" h"; kv[1].textContent = num(Math.max(0,k.rest))+" h"; kv[2].textContent = num(k.pct*100)+" %";
  inp.classList.remove("bump"); void inp.offsetWidth; inp.classList.add("bump");
  const old = document.querySelector(".fsum");
  if (old){
    const w0 = old.querySelector(".fbar i").style.width;
    const tmp = document.createElement("div"); tmp.innerHTML = fsumHtml(faltas()); const fresh = tmp.firstChild;
    const w1 = fresh.querySelector(".fbar i").style.width; fresh.querySelector(".fbar i").style.width = w0;
    old.replaceWith(fresh);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ fresh.querySelector(".fbar i").style.width = w1; }));
  }
}
/* absences: one subject open at a time; the box grows and shrinks smoothly, and the one you tap stays where it is */
const noMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.2,.8,.2,1)";
function closedHeight(d){ const s = d.querySelector("summary"); return s.offsetHeight + (d.offsetHeight - d.clientHeight); }
// if the opened box would end below the screen, scroll down at the same pace as it grows
// (never so far that the tapped title goes under the top bar)
function reveal(d, fullHeight, ms){
  const top = d.getBoundingClientRect().top, bar = (document.querySelector(".cbar") || {offsetHeight:0}).offsetHeight;
  const need = top + fullHeight + 12 - window.innerHeight;
  const room = top - bar - 12;
  const delta = Math.min(need, room);
  if (delta <= 0) return;
  if (!ms){ window.scrollBy(0, delta); return; }
  const y0 = window.scrollY, t0 = performance.now(), ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => { const t = Math.min(1, (now - t0) / ms); window.scrollTo(0, y0 + delta * ease(t)); if (t < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function grow(d, withReveal = true){
  if (d._anim) d._anim.cancel();
  const from = d.offsetHeight; d.open = true; const to = d.offsetHeight;
  if (noMotion() || !d.animate){ if (withReveal) reveal(d, to, 0); return to; }
  d.style.overflow = "hidden";
  d._anim = d.animate({height:[from+"px", to+"px"]}, {duration:300, easing:EASE});
  d._anim.onfinish = d._anim.oncancel = ()=>{ d.style.overflow = ""; d._anim = null; };
  if (withReveal) reveal(d, to, 300);
  return to;
}
function shrink(d){
  if (d._anim) d._anim.cancel();
  if (noMotion() || !d.animate){ d.open = false; return; }
  const from = d.offsetHeight, to = closedHeight(d);
  d.style.overflow = "hidden";
  d._anim = d.animate({height:[from+"px", to+"px"]}, {duration:240, easing:EASE});
  d._anim.onfinish = ()=>{ d.open = false; d.style.overflow = ""; d._anim = null; };
  d._anim.oncancel = ()=>{ d.style.overflow = ""; d._anim = null; };
}
document.addEventListener("click", e=>{
  const sm = e.target.closest("details.fr2 > summary"); if (!sm) return;
  e.preventDefault();
  const d = sm.parentElement;
  if (d.open && !d._anim){ shrink(d); return; }
  const above = [];
  document.querySelectorAll("details.fr2[open]").forEach(o=>{
    if (o === d) return;
    if (o._anim) o._anim.cancel();
    if (o.compareDocumentPosition(d) & Node.DOCUMENT_POSITION_FOLLOWING) above.push(o);   // open box above the tapped one
    else shrink(o);                                                                      // below: folds on its own, nothing moves
  });
  const full = grow(d, false);
  // boxes above fold smoothly while the page scrolls up by the same amount, so the tapped one stays under the finger;
  // if the tapped box would end below the screen, the same movement also scrolls it into view
  const parts = above.map(o=>({o, from:o.offsetHeight, to:closedHeight(o)}));
  const lost = parts.reduce((s,p)=>s + p.from - p.to, 0);
  const top = sm.getBoundingClientRect().top, bar = (document.querySelector(".cbar") || {offsetHeight:0}).offsetHeight;
  const show = Math.max(0, Math.min(top + full + 12 - window.innerHeight, top - bar - 12));
  const y0 = window.scrollY, shift = show - lost;
  const finish = ()=>parts.forEach(p=>{ p.o.open = false; p.o.style.height = ""; p.o.style.overflow = ""; });
  if (noMotion()){ finish(); window.scrollTo(0, Math.max(0, y0 + shift)); return; }
  parts.forEach(p=>{ p.o.style.overflow = "hidden"; p.o.style.height = p.from + "px"; });
  const t0 = performance.now(), ms = 300, ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), k = ease(t);
    parts.forEach(p=>{ p.o.style.height = (p.from + (p.to - p.from) * k) + "px"; });
    window.scrollTo(0, Math.max(0, y0 + shift * k));
    if (t < 1) requestAnimationFrame(step); else finish();
  };
  requestAnimationFrame(step);
}, true);
render();
</script>
<script>
/* offline cache + "Actualizar" banner when a new version has been downloaded */
(function () {
  if (!("serviceWorker" in navigator)) return;
  var reloading = false, shown = false;
  function banner(worker) {
    if (shown || !worker) return; shown = true;
    var b = document.createElement("div");
    b.className = "updbar"; b.setAttribute("role", "status");
    b.innerHTML = '<div><b>Hay una versión nueva de Clarea</b><span>Toca «Actualizar» para usarla ahora.</span></div><button type="button" class="updgo">Actualizar</button><button type="button" class="updno" aria-label="Ahora no">✕</button>';
    document.body.appendChild(b);
    b.querySelector(".updgo").addEventListener("click", function () {
      b.querySelector(".updgo").textContent = "Actualizando…";
      worker.postMessage({type: "SKIP_WAITING"});
      setTimeout(function () { if (!reloading) location.reload(); }, 3000);
    });
    b.querySelector(".updno").addEventListener("click", function () { b.classList.add("closing"); setTimeout(function () { b.remove(); shown = false; }, 220); });
  }
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (reloading) return; reloading = true; location.reload(); });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      function watch(w) { if (!w) return; w.addEventListener("statechange", function () { if (w.state === "installed" && navigator.serviceWorker.controller) banner(w); }); }
      if (reg.waiting && navigator.serviceWorker.controller) banner(reg.waiting);
      watch(reg.installing);
      reg.addEventListener("updatefound", function () { watch(reg.installing); });
      // look for a new version now and every time the app comes back to the screen
      reg.update().catch(function () {});
      // manual check from the account menu
      window.clareaCheckUpdate = function (say) {
        if (reg.waiting) { banner(reg.waiting); return; }
        say("Buscando actualizaciones…");
        reg.update().then(function () {
          setTimeout(function () {
            if (reg.waiting) banner(reg.waiting);
            else if (reg.installing) say("Descargando la versión nueva…");
            else say("Ya tienes la última versión.");
          }, 1500);
        }).catch(function () { say("Sin conexión: no se puede comprobar ahora."); });
      };
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
    }).catch(function () {});
  });
})();
</script>
